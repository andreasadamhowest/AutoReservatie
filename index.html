<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Familie reservatiebord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="wrap" id="app" style="display:none;">
  <header>
    <div class="brand">
      <h1>Reservatiebord</h1>
    </div>
    <div class="me-pill" id="mePill">
      <span class="me-dot" id="meDot"></span>
      <span id="meLabel">Jij</span>
      <button id="meEdit">✎</button>
    </div>
  </header>

  <div class="nextup" id="nextUp" style="display:none;"></div>

  <div class="cal">
    <div class="cal-head">
      <div class="cal-nav">
        <button id="prevMonth">‹</button>
        <button id="nextMonth">›</button>
      </div>
      <h2 id="calMonthLabel"></h2>
      <button class="cal-today-btn" id="calToday">Vandaag</button>
    </div>
    <div class="cal-dow" id="calDow"></div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="panel-head">
    <h2 id="panelTitle">Vandaag</h2>
    <span id="panelSub"></span>
  </div>

  <div class="res-list" id="resList"></div>

  <button class="add-btn" id="openAdd">＋ Nieuwe reservatie</button>
</div>

<div id="loading">Bord wordt opgehaald…</div>

<!-- add reservation sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h3>Nieuwe reservatie</h3>
    <div class="err" id="formErr"></div>
    <div class="field">
      <label>Datum</label>
      <input type="date" id="fDate">
    </div>
    <div class="row2">
      <div class="field">
        <label>Van</label>
        <input type="time" id="fStart" value="09:00">
      </div>
      <div class="field">
        <label>Tot</label>
        <input type="time" id="fEnd" value="11:00">
      </div>
    </div>
    <div class="field">
      <label>Reden (optioneel)</label>
      <input type="text" id="fNote" placeholder="bv. boodschappen, naar het station...">
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="cancelAdd">Annuleren</button>
      <button class="btn-save" id="saveAdd">Reserveren</button>
    </div>
  </div>
</div>

<!-- name prompt sheet -->
<div class="overlay" id="nameOverlay">
  <div class="sheet">
    <h3>Wie ben jij?</h3>
    <div class="name-prompt">
      <input type="text" id="nameInput" placeholder="Voornaam">
      <div class="color-field">
        <label>Kleur</label>
        <div class="color-options" id="colorOptions"></div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="nameCancel">Annuleren</button>
      <button class="btn-save" id="nameSave">Opslaan</button>
    </div>
  </div>
</div>

<!-- delete confirmation sheet -->
<div class="overlay" id="deleteOverlay">
  <div class="sheet confirm-sheet">
    <h3>Reservatie verwijderen?</h3>
    <p id="deleteMessage">Weet je zeker dat je deze reservatie wilt verwijderen?</p>
    <div class="sheet-actions">
      <button class="btn-cancel" id="deleteCancel">Annuleren</button>
      <button class="btn-save" id="deleteConfirm">Verwijderen</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
